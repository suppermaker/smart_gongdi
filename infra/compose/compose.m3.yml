name: sitepilot-m3
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sitepilot
      POSTGRES_PASSWORD: "${SITEPILOT_DB_PASSWORD:?SITEPILOT_DB_PASSWORD is required}"
      POSTGRES_DB: sitepilot
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepilot -d sitepilot"]
      interval: 2s
      timeout: 3s
      retries: 30
