[project]
name = "sitepilot-agent-runtime"
version = "0.1.0"
description = "Durable Temporal runtime for SitePilot investigations"
requires-python = ">=3.13"
dependencies = [
  "mcp>=2,<3",
  "temporalio>=1.20.0,<2",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitepilot_agent_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_temporal: requires the repository Temporal Docker Compose stack", "m3_integration: requires live Java MCP and Temporal"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
