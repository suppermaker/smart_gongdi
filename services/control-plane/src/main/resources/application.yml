spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sitepilot}
    username: ${DATABASE_USER:sitepilot}
    password: ${DATABASE_PASSWORD:sitepilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}

sitepilot:
  mcp:
    hmac-secret: ${SITEPILOT_MCP_HMAC_SECRET:}
    allowed-hosts: ${SITEPILOT_MCP_ALLOWED_HOSTS:localhost:18080,127.0.0.1:18080}
    allowed-origins: ${SITEPILOT_MCP_ALLOWED_ORIGINS:}
  otel:
    otlp-endpoint: ${SITEPILOT_OTEL_OTLP_ENDPOINT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
