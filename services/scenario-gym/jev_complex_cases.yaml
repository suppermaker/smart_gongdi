        attributes: {zone: building-b, offline_duration_seconds: 615}
      observations:
        nearby_equipment: {total: 18, offline: 1, intermittent: 0}
        gateway: {uplink_packet_loss_percent: 0.2, status: healthy}
        local_controller: {self_test: failed, fault_code: MOTOR_OVERCURRENT}
        maintenance: {active_plan: false, overdue_items: 1}
      fact_refs: [event:event_type, observation:nearby_equipment, observation:gateway, observation:local_controller]
