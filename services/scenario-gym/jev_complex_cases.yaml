  - case_id: high-altitude-two-candidates
    title: 高处作业人员存在两个身份候选
    state:
      event:
        event_id: evt.worker.20261103.011
        event_type: work.high-altitude.started
        occurred_at: 2026-11-03T10:16:08+08:00
        subject: {type: worker-observation, id: observation.synthetic.11}
        attributes: {zone: tower-2, work_type: high-altitude, face_confidence: 0.64}
      observations:
        identity_candidates:
          - {worker_ref: worker.synthetic.2048, probability: 0.52, badge_seen: false}
          - {worker_ref: worker.synthetic.2091, probability: 0.43, badge_seen: true}
        permit: {permit_id: permit.synthetic.88, assigned_worker_refs: [worker.synthetic.2091]}
        certificates:
          worker.synthetic.2048: {high_altitude: valid}
          worker.synthetic.2091: {high_altitude: expired}
      graph_summary: {active_hypotheses: 3, open_conflicts: 2, revision: 3}
      fact_refs: [event:face_confidence, identity:candidates, permit:assigned_workers]
    expected_primary_intent: identity_or_qualification_risk
    required_capabilities: [identity_resolution, certificate_verification, permit_validation, regulation_retrieval, conclusion_verification]
    expected_human: true
    urgency_min: 2.0

