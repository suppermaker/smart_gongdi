schema_version: "1.0"
cases:
  - case_id: crane-zone-partial-outage
    title: 塔吊离线与区域链路间歇性故障
    state:
      event:
        event_id: evt.crane.20261103.001
        event_type: equipment.offline
        occurred_at: 2026-11-03T08:42:17+08:00
        subject: {type: tower-crane, id: crane.synthetic.03}
        attributes: {zone: zone-a, offline_duration_seconds: 428, last_heartbeat_rssi: -91}
      observations:
        nearby_equipment: {total: 14, offline: 9, intermittent: 3, observed_at: 2026-11-03T08:45:00+08:00}
        gateway: {uplink_packet_loss_percent: 68, power: normal, firmware_restart_count_24h: 0}
        local_controller: {self_test: normal, emergency_stop: false}
        maintenance: {active_plan: false, last_maintenance_days_ago: 41}
      graph_summary: {active_hypotheses: 3, open_conflicts: 1, revision: 2}
      fact_refs: [event:event_type, observation:nearby_equipment, observation:gateway, observation:local_controller]
    expected_primary_intent: zone_connectivity_failure
    required_capabilities: [equipment_observation, network_diagnosis, maintenance_lookup, conclusion_verification]
    expected_human: false
    urgency_min: 1.5

