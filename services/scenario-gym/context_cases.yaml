      - {id: hyp-network, role: common, required: true, score: 1.0, tokens: 80}
      - {id: ev-nearby, role: investigator, required: true, score: 0.95, tokens: 120}
      - {id: ev-local-counter, role: investigator, required: true, contradiction: true, detail_required: true, score: 0.35, tokens: 120}
