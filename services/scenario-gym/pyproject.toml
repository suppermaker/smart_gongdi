[project]
name = "sitepilot-scenario-gym"
version = "0.1.0"
description = "Deterministic contracts and Scenario Gym validation for SitePilot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv]
package = false

